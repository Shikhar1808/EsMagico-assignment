services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGO_URL: mongodb://mongo:27017/results_portal
      WEB_CONCURRENCY: 2 # one admin needs little; 2 workers still keep crash recovery
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
